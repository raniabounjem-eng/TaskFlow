server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Routing Angular (SPA) : toutes les routes renvoient index.html
    # Sans ça, un refresh sur /dashboard donne 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend Spring Boot (évite les problèmes CORS en prod)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Optimisation : cache des assets statiques
    location ~* \.(js|css|png|jpg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
