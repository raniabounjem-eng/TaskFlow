# ── .gitlab-ci.yml ─────────────────────────────────────────────────────────
# Pipeline GitLab CI/CD pour TaskFlow
#
# Stages :
#   1. test    = tests unitaires backend + frontend
#   2. build   = compilation + création images Docker
#   3. deploy  = déploiement (staging ou production)
#
# Variables à configurer dans GitLab (Settings > CI/CD > Variables) :
#   CI_REGISTRY_USER, CI_REGISTRY_PASSWORD, DEPLOY_HOST, DEPLOY_USER, SSH_KEY

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  BACKEND_IMAGE:  "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"

# ── STAGE 1 : Tests ──────────────────────────────────────────────────────────

test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd taskflow-backend
    - mvn test -q
  artifacts:
    reports:
      junit: taskflow-backend/target/surefire-reports/*.xml
  only:
    - merge_requests
    - main
    - develop

test-frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd taskflow-frontend
    - npm ci
    - npm run test -- --watch=false --browsers=ChromeHeadless
  only:
    - merge_requests
    - main

# ── STAGE 2 : Build Docker ────────────────────────────────────────────────────

build-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $BACKEND_IMAGE ./taskflow-backend
    - docker push $BACKEND_IMAGE
    - docker tag $BACKEND_IMAGE "$CI_REGISTRY_IMAGE/backend:latest"
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"
  only:
    - main

build-frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $FRONTEND_IMAGE ./taskflow-frontend
    - docker push $FRONTEND_IMAGE
  only:
    - main

# ── STAGE 3 : Deploy ─────────────────────────────────────────────────────────

deploy-staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  script:
    - ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST "
        cd /opt/taskflow &&
        docker-compose pull &&
        docker-compose up -d --remove-orphans"
  environment:
    name: staging
    url: http://$DEPLOY_HOST
  only:
    - main
  when: manual   # Déploiement manuel pour staging
